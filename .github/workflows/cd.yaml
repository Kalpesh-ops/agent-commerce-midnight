name: Pactra Protocol CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - production

jobs:
  build-and-verify:
    name: Build & Verify Release Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security & Secret Scan Quality Gate
        run: npm run check:security

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Compile Contract Artifacts
        run: npm run compile:contract

      - name: Run Test Suites (164 Automated Tests)
        run: npm run test

      - name: Build Production UI Distribution
        run: npm run build:ui

      - name: Verify Distribution Integrity
        run: |
          echo "Verifying compiled release bundle..."
          test -f ui/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -d ui/dist/assets || { echo "Missing assets directory"; exit 1; }
          test -d ui/dist/task_escrow || { echo "Missing task_escrow ZK artifacts"; exit 1; }
          echo "✅ Distribution package verified successfully."

      - name: Archive Production Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pactra-production-bundle
          path: ui/dist/
          retention-days: 30

  deploy-distribution:
    name: Continuous Deployment & Release Publication
    needs: build-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Distribution
        uses: actions/download-artifact@v4
        with:
          name: pactra-production-bundle
          path: ui/dist

      - name: Deploy to Vercel (if configured)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel production..."
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publish Deployment Summary
        run: |
          echo "### 🚀 Pactra Protocol Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** Midnight Preprod Testnet" >> $GITHUB_STEP_SUMMARY
          echo "- **Default Contract:** \`0200021c172da6a603bf236166ebfc00e3185392fe8890731fc612140bb0d970923f\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Indexer URL:** \`https://indexer.preprod.midnight.network/api/v4/graphql\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Gate Status:** Passed (164 automated tests, static typecheck, security audit)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Distribution:** Preserved in GitHub Actions artifacts (30-day retention)" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "- **Vercel Deployment:** Dispatched with production token" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Vercel Git Integration:** Vercel git integration auto-deploys from \`main\` commit on push" >> $GITHUB_STEP_SUMMARY
          fi
