name: Pactra Protocol CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Typecheck, Build, Test & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        continue-on-error: true
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security & Secret Scan
        run: npm run check:security

      - name: Compact Contract Compilation
        run: npm run compile:contract

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Run All Tests (Contracts + UI Services)
        run: npm run test

      - name: Production UI Build
        run: npm run build:ui

      - name: Upload Production UI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pactra-ui-dist
          path: ui/dist/
          retention-days: 7
